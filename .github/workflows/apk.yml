name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'build/*.py', 'build/data/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Collect web app
        run: |
          mkdir -p www
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png pdf.min.js pdf.worker.min.js www/

      - name: Wrap with Capacitor
        run: |
          npm init -y >/dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init Underway uk.sourmilkman.underway --web-dir www
          npx cap add android
          npx cap sync android

      - name: App icon
        run: |
          cp -r build/android-icons/* android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Underway.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Underway APK ${{ github.run_number }}
          body: Download Underway.apk on your phone and open it to install. You may need to allow installs from your browser.
          files: Underway.apk
          make_latest: true
