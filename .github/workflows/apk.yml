name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'build/*.py', 'build/data/**', '.github/workflows/cold-check.yml', 'build/android/cold-check.sh']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Collect web app
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon-192.png icon-512.png pdf.min.js pdf.worker.min.js www/

      - name: Wrap with Capacitor
        run: |
          npm init -y >/dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init Underway uk.sourmilkman.underway --web-dir www
          npx cap add android
          npx cap sync android

      - name: App icon and version number
        run: |
          cp -r build/android-icons/* android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Use the project's fixed signing key, so updates install over the top
        run: |
          python3 - <<'PY'
          p = 'android/app/build.gradle'
          s = open(p).read()
          block = '''android {
              signingConfigs {
                  debug {
                      storeFile file('../../build/android/underway.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          '''
          assert s.count('android {') >= 1
          s = s.replace('android {', block, 1)
          open(p, 'w').write(s)
          PY
          head -20 android/app/build.gradle

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Underway.apk

      - name: Check the APK is signed with the project key
        run: keytool -printcert -jarfile Underway.apk | tee /dev/stderr | grep -q "CN=Underway"

      - name: Previous APK, for comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download apk-2 -p Underway.apk -O old.apk || true
          # apk-2 is the version from 9 October, before the no-signal fix

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on an Android emulator with no signal and a weak signal
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash build/android/emulator-test.sh

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Underway APK ${{ github.run_number }}
          body: |
            Download Underway.apk on your phone and open it to install.
            Works with no signal: everything the app needs is inside it.
            From this version on, updates install over the top without uninstalling.
          files: |
            Underway.apk
            shots/*.png
          make_latest: true
